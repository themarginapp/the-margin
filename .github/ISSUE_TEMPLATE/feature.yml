name: Feature request
description: Something you wish The Margin did.
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation you are in, more than the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today
  - type: textarea
    id: idea
    attributes:
      label: What would help
